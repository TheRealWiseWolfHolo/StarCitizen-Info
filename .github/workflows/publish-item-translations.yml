name: Publish item translations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/item-translations/**"
      - "docs/item-translations/**"
      - "scripts/build-item-translations-json.mjs"
      - "scripts/hydrate-published-docs.mjs"
      - ".github/workflows/publish-item-translations.yml"
      - ".github/workflows/publish-ships.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      translation_only: ${{ steps.guard.outputs.translation_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm this is a translation-only push
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "translation_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"
          printf '%s\n' "$changed_files"

          disallowed_files="$(printf '%s\n' "$changed_files" | grep -Ev '^(data/item-translations/|docs/item-translations/|scripts/build-item-translations-json\.mjs$|scripts/hydrate-published-docs\.mjs$|\.github/workflows/publish-item-translations\.yml$|\.github/workflows/publish-ships\.yml$|README\.md$)' || true)"

          if [[ -n "$disallowed_files" ]]; then
            echo "This push contains non-translation files, so the full publish workflow should handle it:"
            printf '%s\n' "$disallowed_files"
            echo "translation_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "translation_only=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.translation_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hydrate docs from current published feeds
        run: node scripts/hydrate-published-docs.mjs

      - name: Generate item translation feed
        run: node scripts/build-item-translations-json.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs:
      - changes
      - build
    if: needs.changes.outputs.translation_only == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
